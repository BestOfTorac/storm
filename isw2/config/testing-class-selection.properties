# ISW2 - Testing / Milestone 4 class-selection policy
#
# IMPORTANT:
# This structural eligibility policy was defined before inspecting
# SonarCloud NSMELLS values for Storm 3.0.0.
#
# Falessi protocol:
# 1. Rank classes of the last release by NSMELLS.
# 2. Filter classes that are too small.
# 3. Select two classes according to the student's name.
#
# "Too small" operationalization used in this project:
# - only primary Java CLASS types;
# - TypeLOC >= first quartile of concrete CLASS TypeLOC = 32;
# - DeclaredMethods >= first quartile of concrete CLASS methods = 2.
#
# Constructors are not counted toward the method threshold.

releaseTag=v3.0.0

requiredTypeKind=CLASS
minTypeLOC=32
minDeclaredMethods=2

includeAbstract=true
includeExternalModules=true
includeExampleModules=true
includeIntegrationTestModule=true
includeFluxModules=true

selectorLetter=V
selectorLetterNumber=22
selectionModulo=5
selectionCase=2

firstOffset=2
lastOffset=2
# Ranking policy
# Defined before computing the final two selected classes.
rankMetric=NSMELLS
rankOrder=DESC
tieBreak=FQCN_ASC
selectionAppliedAfterStructuralFilter=true
# Effective second-class replacement for the testing experiment.
#
# IMPORTANT:
# lastOffset=2 above remains the original Falessi selection result.
# The effective class below was obtained by scanning the same frozen
# ranking sequentially from the original lower-end candidate and
# rejecting candidates only for documented testing-suitability reasons.
secondClassReplacementRequired=true
secondClassReplacementPolicy=SEQUENTIAL_SAME_RANKING_TESTING_SUITABILITY
secondClassOriginalOffset=2
secondClassEffectiveOffset=19
secondClassEffectiveEligibleRank=362
secondClassEffectiveFQCN=org.apache.storm.redis.bolt.RedisFilterBolt
secondClassEffectiveModule=external/storm-redis
secondClassReplacementEvidence=isw2/docs/testing-second-class-reassessment.md
